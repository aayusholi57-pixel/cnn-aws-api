name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd cnn-aws-api
            git pull origin main
            sudo docker build -t cnn-api .
            sudo docker stop cnn-api-container || true
            sudo docker rm cnn-api-container || true
            sudo docker run -d --name cnn-api-container -p 8080:9000 cnn-api