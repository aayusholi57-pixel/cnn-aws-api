name: Build, Test and Deploy CNN API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnn-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t cnn-api:test .

  deploy:
    name: Deploy to AWS EC2
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production Docker image
        run: docker build --platform linux/amd64 -t cnn-api:latest .

      - name: Prepare SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Clean EC2 Docker storage
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "Disk before cleanup:"
            df -h /
            if sudo docker inspect cnn-api-container >/dev/null 2>&1; then
              sudo docker rm -f cnn-api-container
            fi
            sudo docker image rm -f cnn-api:latest 2>/dev/null || true
            sudo docker image prune -af
            sudo docker builder prune -af 2>/dev/null || true
            rm -f ~/cnn-api.tar ~/cnn-api.tar.gz
            echo "Disk after cleanup:"
            df -h /

      - name: Stream image directly into Docker on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -o pipefail
          docker save cnn-api:latest \
            | gzip -1 \
            | ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
                "$EC2_USERNAME@$EC2_HOST" 'gunzip | sudo docker load'

      - name: Deploy with health check and rollback
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            sudo docker rm -f cnn-api-candidate 2>/dev/null || true

            sudo docker run -d --name cnn-api-candidate --restart unless-stopped -p 9001:9000 cnn-api:latest

            ready=0
            for i in $(seq 1 30); do
              if sudo docker exec cnn-api-candidate python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2).read()"; then
                ready=1
                break
              fi
              sleep 2
            done

            if [ "$ready" -ne 1 ]; then
              sudo docker logs --tail 100 cnn-api-candidate
              sudo docker rm -f cnn-api-candidate
              exit 1
            fi

            if sudo docker inspect cnn-api-container >/dev/null 2>&1; then
              sudo docker rm -f cnn-api-previous 2>/dev/null || true
              sudo docker rename cnn-api-container cnn-api-previous
              sudo docker stop cnn-api-previous
            fi

            sudo docker rm -f cnn-api-container 2>/dev/null || true
            sudo docker run -d --name cnn-api-container --restart unless-stopped -p 8080:9000 cnn-api:latest

            healthy=0
            for i in $(seq 1 30); do
              if sudo docker exec cnn-api-container python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2).read()"; then
                healthy=1
                break
              fi
              sleep 2
            done

            sudo docker rm -f cnn-api-candidate 2>/dev/null || true

            if [ "$healthy" -ne 1 ]; then
              sudo docker logs --tail 100 cnn-api-container
              sudo docker rm -f cnn-api-container

              if sudo docker inspect cnn-api-previous >/dev/null 2>&1; then
                sudo docker rename cnn-api-previous cnn-api-container
                sudo docker start cnn-api-container
              fi

              exit 1
            fi

            sudo docker rm -f cnn-api-previous 2>/dev/null || true
            rm -f ~/cnn-api.tar
            sudo docker image prune -f

            echo "Deployment completed successfully."
            sudo docker ps --filter name=cnn-api-container
